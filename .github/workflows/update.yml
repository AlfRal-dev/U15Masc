name: Mise a jour du rapport FFHB

on:
  schedule:
    - cron: '10 5,11,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recuperer les donnees et regenerer la page
        run: |
          cd tools
          python3 fetch_blocks.py
          python3 fetch_matches.py
          python3 -m pip install pypdf --quiet 2>/dev/null || echo "pypdf absent"
          python3 fetch_fdms.py || echo "feuilles FDME non actualisées (les statistiques de la dernière exécution restent utilisées)"
          python3 fetch_history.py || echo "historique non actualisé (les données de la poule restent à jour)"
          python3 build.py

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Mise a jour automatique des donnees FFHB"
            git push
          else
            echo "Aucun changement"
          fi

  pages:
    runs-on: ubuntu-latest
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
